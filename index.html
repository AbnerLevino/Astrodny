<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- Ícone da tela de início no iOS (iPhone não aceita SVG aqui; precisa ser PNG) -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0d1f" />
    <!-- Tela cheia quando "Adicionar à Tela de Início" (modo standalone, sem barras do Safari) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Astrodny" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Astrodny</title>
    <!-- Altura do TECLADO na tela (--kb). O app fica em tela cheia fixa; só o input
         sobe por --kb pra ficar acima do teclado (ele "segue" o teclado). No iOS a
         visualViewport encolhe quando o teclado abre; a diferença é a altura dele. -->
    <script>
      (function () {
        var vv = window.visualViewport
        function ajustarTeclado() {
          var kb = vv ? Math.max(0, window.innerHeight - vv.height - vv.offsetTop) : 0
          document.documentElement.style.setProperty('--kb', kb + 'px')
        }
        ajustarTeclado()
        if (vv) {
          vv.addEventListener('resize', ajustarTeclado)
          vv.addEventListener('scroll', ajustarTeclado)
        }
        window.addEventListener('orientationchange', ajustarTeclado)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
